<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid - Breakout Game Avanzado</title>
    <style>
        /* Estilos CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .game-container { text-align: center; position: relative; }
        h1 {
            color: white; margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .canvas-wrap { display: inline-block; max-width: 95vw; width: 480px; }
        canvas {
            width: 100%; height: auto;
            border: 3px solid white;
            background: #000;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            touch-action: none; /* Previene el comportamiento por defecto de 'touch' */
        }
        .info {
            color: white; font-size: 18px; margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .controls { color: #ddd; font-size: 14px; margin-top: 10px; }
        #gameOverScreen, #winScreen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .screen-content { text-align: center; color: white; animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .screen-content h1 { font-size: 60px; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,107,107,.8); }
        .screen-content p { font-size: 24px; margin: 10px 0; }
        .screen-content .final-score { font-size: 32px; color: #FFD93D; margin: 30px 0; font-weight: bold; }
        .screen-content .level-info { font-size: 20px; color: #6BCB77; margin: 20px 0; }
        .button-group { margin-top: 40px; display: flex; gap: 20px; justify-content: center; }
        button {
            padding: 15px 40px; font-size: 18px;
            border: none; border-radius: 8px; cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold; text-transform: uppercase;
        }
        .btn-primary {
            background: #4ECDC4; color: white;
            box-shadow: 0 5px 15px rgba(78,205,196,0.4);
        }
        .btn-primary:hover {
            background: #2BA39F;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(78,205,196,0.6);
        }
        .btn-secondary {
            background: #FF6B6B; color:white;
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }
        .btn-secondary:hover {
            background: #FF4444;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,107,107,0.6);
        }
        .level-display {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 25px; border-radius: 8px;
            color: white; font-size: 16px;
            border: 2px solid #4ECDC4;
        }
        .mobile-controls {
            display: none; position: fixed;
            bottom: 12px; left: 50%; transform: translateX(-50%);
            z-index: 999; display: flex; gap: 12px; align-items: center;
        }
        .mobile-controls button {
            width: 72px; height: 72px;
            border-radius: 12px; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            padding: 0; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            -webkit-tap-highlight-color: transparent;
            touch-action:none;
        }
        
        /* FIX MÓVIL: Evita superposición de info con controles */
        @media (max-width:768px) {
            .controls{ display:none; }
            .canvas-wrap{ width:95vw; }
            .level-display{ top:12px; right:12px; padding:8px 12px; }
            .mobile-controls{ display:flex; }
            .game-container > .info {
                /* Crea un margen inferior suficiente para los controles fijos (altura del botón 72px + padding 12px) */
                margin-bottom: 84px; 
                font-size: 16px;
            }
            .screen-content h1{ font-size:40px; }
            .screen-content p{ font-size:18px; }
        }
    </style>
</head>

<body>

    <div class="game-container">
        <h1>🎮 Arkanoid</h1>

        <div class="level-display">
            Nivel: <span id="levelNumber">1</span>
        </div>

        <div class="canvas-wrap">
            <canvas width="480" height="400"></canvas>
        </div>

        <div class="info">
            Puntos: <span id="score">0</span> | Vidas: <span id="lives">3</span>
        </div>

        <div class="controls">
            Usa ← → o A/D para mover • ESPACIO para pausar • En móvil: arrastra o usa los botones
        </div>

        <div class="mobile-controls" id="mobileControls">
            <button id="mobileLeft" class="btn-secondary">◀</button>
            <button id="mobilePause" class="btn-primary">⏸</button>
            <button id="mobileRight" class="btn-secondary">▶</button>
        </div>
    </div>

    <div id="winScreen">
        <div class="screen-content">
            <h1>🎉 ¡VICTORIA! 🎉</h1>
            <p>¡Nivel completado!</p>
            <div class="level-info">Nivel: <span id="winLevel">1</span></div>
            <div class="final-score">Puntos: <span id="winScore">0</span></div>
            <div class="button-group">
                <button id="btnNext" class="btn-primary" onclick="nextLevel()">Siguiente Nivel</button>
                <button class="btn-secondary" onclick="mainMenu()">Menú Principal</button>
            </div>
        </div>
    </div>

    <div id="gameOverScreen">
        <div class="screen-content">
            <h1>💀 GAME OVER 💀</h1>
            <p>¡Se acabaron las vidas!</p>
            <div class="level-info">Llegaste al nivel: <span id="gameOverLevel">1</span></div>
            <div class="final-score">Puntos finales: <span id="gameOverScore">0</span></div>
            <div class="button-group">
                <button class="btn-primary" onclick="resetGame()">Reintentar</button>
                <button class="btn-secondary" onclick="mainMenu()">Menú Principal</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.querySelector('canvas');
        const ctx = canvas.getContext('2d');

        // --- Configuración base (para escalado) ---
        const BASE_CANVAS_WIDTH = 480;
        const BASE_CANVAS_HEIGHT = 400;
        const BASE_BALL_RADIUS = 8;
        const BASE_PADDLE_WIDTH = 75;
        const BASE_PADDLE_HEIGHT = 12;
        const BASE_PADDLE_BOTTOM = 10;
        const BASE_PADDLE_SPEED = 6;
        const maxBallSpeed = 7;

        // --- Variables dinámicas y de estado ---
        let dpr = window.devicePixelRatio || 1;
        let logicalWidth = BASE_CANVAS_WIDTH;
        let logicalHeight = BASE_CANVAS_HEIGHT;
        let scale = 1;
        let ballRadius = BASE_BALL_RADIUS;
        let ballX, ballY, ballDX, ballDY, ballSpeed;
        let paddleHeight, paddleWidth, paddleX, paddleY;
        let paddleSpeed;
        let rightPressed = false;
        let leftPressed = false;
        let isPaused = false;
        let isGameRunning = true;
        let score = 0;
        let lives = 3;
        let currentLevel = 1;

        // --- Configuración de Niveles ---
        const levelConfigs = {
            1: { rows: 4, cols: 6, brickHealth: 1, speedMultiplier: 1 },
            2: { rows: 5, cols: 7, brickHealth: 1, speedMultiplier: 1.15 },
            3: { rows: 5, cols: 8, brickHealth: 2, speedMultiplier: 1.3 },
            4: { rows: 6, cols: 8, brickHealth: 2, speedMultiplier: 1.45 },
            5: { rows: 6, cols: 9, brickHealth: 3, speedMultiplier: 1.6 }
        };

        // --- Ladrillos ---
        let brickRowCount, brickColumnCount;
        let brickPadding = 5;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 10;
        let brickWidth;
        let brickHeight;
        let bricks = [];
        let totalBricks = 0;
        let bricksDestroyed = 0;

        // --- Funciones de Inicialización/Escalado ---
        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            logicalWidth = Math.min(window.innerWidth * 0.95, 720);
            logicalWidth = Math.max(logicalWidth, 320);
            scale = logicalWidth / BASE_CANVAS_WIDTH;
            logicalHeight = Math.round(BASE_CANVAS_HEIGHT * scale);
            canvas.style.width = logicalWidth + 'px';
            canvas.style.height = logicalHeight + 'px';
            canvas.width = Math.round(logicalWidth * dpr);
            canvas.height = Math.round(logicalHeight * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ballRadius = Math.max(4, BASE_BALL_RADIUS * scale);
            paddleWidth = Math.max(40, BASE_PADDLE_WIDTH * scale);
            paddleHeight = Math.max(8, BASE_PADDLE_HEIGHT * scale);
            paddleSpeed = Math.max(2, BASE_PADDLE_SPEED * scale);
            paddleY = logicalHeight - paddleHeight - BASE_PADDLE_BOTTOM * scale;

            if (typeof ballX === 'undefined' || isNaN(ballX)) ballX = logicalWidth / 2;
            if (typeof ballY === 'undefined' || isNaN(ballY)) ballY = logicalHeight - 60 * scale;
            if (typeof paddleX === 'undefined' || isNaN(paddleX)) {
                paddleX = (logicalWidth - paddleWidth) / 2;
            } else {
                paddleX = Math.min(Math.max(paddleX, 0), logicalWidth - paddleWidth);
            }
        }

        function computeBrickSizes() {
            const config = levelConfigs[currentLevel] || levelConfigs[5];
            const paddingScaled = Math.round(brickPadding * scale);
            const offsetLeftScaled = Math.round(brickOffsetLeft * scale);
            const totalPadding = (config.cols - 1) * paddingScaled + offsetLeftScaled * 2;
            let dynamicBrickWidth = Math.floor((logicalWidth - totalPadding) / config.cols);
            dynamicBrickWidth = Math.max(30, dynamicBrickWidth);
            const dynamicBrickHeight = Math.max(10, Math.round(15 * scale)); 
            return { dynamicBrickWidth, dynamicBrickHeight };
        }

        function initBricks() {
            const config = levelConfigs[currentLevel] || levelConfigs[5];
            brickRowCount = config.rows;
            brickColumnCount = config.cols;
            bricks = [];
            totalBricks = 0;
            bricksDestroyed = 0;
            const sizes = computeBrickSizes();
            brickWidth = sizes.dynamicBrickWidth;
            brickHeight = sizes.dynamicBrickHeight;
            const offsetTopScaled = Math.round(brickOffsetTop * scale);
            const offsetLeftScaled = Math.round(brickOffsetLeft * scale);
            const paddingScaled = Math.round(brickPadding * scale);
            for (let row = 0; row < brickRowCount; row++) {
                bricks[row] = [];
                for (let col = 0; col < brickColumnCount; col++) {
                    const brickX = col * (brickWidth + paddingScaled) + offsetLeftScaled;
                    const brickY = row * (brickHeight + paddingScaled) + offsetTopScaled;
                    bricks[row][col] = {
                        x: brickX,
                        y: brickY,
                        status: 1,
                        health: config.brickHealth
                    };
                    totalBricks++;
                }
            }
        }

        function resetBall() {
            ballX = logicalWidth / 2;
            ballY = logicalHeight - 60 * scale;
            const config = levelConfigs[currentLevel] || levelConfigs[5];
            
            // ⭐️ MEJORA 1: Velocidad inicial aumentada de 3 a 4
            const baseSpeed = 4 * config.speedMultiplier; 
            
            ballSpeed = baseSpeed;
            const angle = (Math.random() * Math.PI / 3) - (Math.PI / 6);
            const dir = Math.random() > 0.5 ? 1 : -1;
            ballDX = Math.cos(angle) * baseSpeed * dir;
            ballDY = -Math.abs(Math.sin(angle) * baseSpeed);
            paddleX = (logicalWidth - paddleWidth) / 2;
        }


        // --- Funciones de Dibujo ---
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#FF6B6B";
            ctx.fill();
            ctx.strokeStyle = "#FF4444";
            ctx.lineWidth = Math.max(1, 2 * scale);
            ctx.stroke();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.fillStyle = "#4ECDC4";
            ctx.fillRect(paddleX, paddleY, paddleWidth, paddleHeight);
            ctx.strokeStyle = "#2BA39F";
            ctx.lineWidth = Math.max(1, 2 * scale);
            ctx.strokeRect(paddleX, paddleY, paddleWidth, paddleHeight);
        }

        function drawBricks() {
            for (let row = 0; row < brickRowCount; row++) {
                for (let col = 0; col < brickColumnCount; col++) {
                    const brick = bricks[row][col];
                    if (!brick || brick.status !== 1) continue;
                    
                    const colors = ["#FF6B6B", "#FFA500", "#FFD93D", "#6BCB77", "#4ECDC4", "#95E1D3"];
                    const baseColor = colors[row % colors.length];
                    
                    if (brick.health === 1) {
                        ctx.fillStyle = baseColor;
                    } else if (brick.health === 2) {
                        ctx.fillStyle = baseColor + "CC";
                    } else {
                        ctx.fillStyle = baseColor + "99";
                    }

                    ctx.fillRect(brick.x, brick.y, brickWidth, brickHeight);
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = Math.max(1, 1 * scale);
                    ctx.strokeRect(brick.x, brick.y, brickWidth, brickHeight);
                    if (brick.health > 1) {
                        ctx.fillStyle = "#fff";
                        ctx.font = `bold ${Math.max(10, Math.round(12 * scale))}px Arial`;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(String(brick.health), brick.x + brickWidth / 2, brick.y + brickHeight / 2);
                    }
                }
            }
        }


        // --- Colisiones ---
        
        function circleRectCollision(cx, cy, r, rx, ry, rw, rh) {
            const closestX = Math.max(rx, Math.min(cx, rx + rw));
            const closestY = Math.max(ry, Math.min(cy, ry + rh));
            const dx = cx - closestX;
            const dy = cy - closestY;
            return (dx * dx + dy * dy) <= (r * r);
        }

        function collisionDetection() {
            // Colisión con ladrillos
            for (let row = 0; row < brickRowCount; row++) {
                for (let col = 0; col < brickColumnCount; col++) {
                    const brick = bricks[row][col];
                    if (!brick || brick.status !== 1) continue;
                    if (circleRectCollision(ballX, ballY, ballRadius, brick.x, brick.y, brickWidth, brickHeight)) {
                        const prevHealth = brick.health;
                        brick.health--;
                        if (brick.health <= 0) {
                            brick.status = 0;
                            bricksDestroyed++;
                        }
                        score += 10 * prevHealth;
                        document.getElementById('score').textContent = score;

                        // Resolver rebote
                        const brickCenterX = brick.x + brickWidth / 2;
                        const brickCenterY = brick.y + brickHeight / 2;
                        const diffX = Math.abs(ballX - brickCenterX) / (brickWidth / 2);
                        const diffY = Math.abs(ballY - brickCenterY) / (brickHeight / 2);

                        if (diffX > diffY) {
                            ballDX = -ballDX; // Colisión lateral
                        } else {
                            ballDY = -ballDY; // Colisión superior/inferior
                        }

                        // Aumentar velocidad con tope
                        const currentSpeed = Math.sqrt(ballDX * ballDX + ballDY * ballDY) || 1;
                        const speedIncrease = 1.02 + (bricksDestroyed / Math.max(1, totalBricks)) * 0.1;
                        const config = levelConfigs[currentLevel] || levelConfigs[5];
                        const newSpeed = Math.min(currentSpeed * speedIncrease, maxBallSpeed * config.speedMultiplier);
                        const ang = Math.atan2(ballDY, ballDX);
                        ballDX = Math.cos(ang) * newSpeed;
                        ballDY = Math.sin(ang) * newSpeed;
                    }
                }
            }

            // Colisión con raqueta (MEJORADO el ángulo de rebote)
            if (ballY + ballRadius >= paddleY && ballY - ballRadius <= paddleY + paddleHeight &&
                ballX >= paddleX && ballX <= paddleX + paddleWidth) {
                
                if (ballDY > 0) { // Solo rebotar si la pelota va hacia abajo
                    // Calcular posición de impacto relativo [-1, 1]
                    const relativeHit = ballX - (paddleX + paddleWidth / 2);
                    const normalizedHit = relativeHit / (paddleWidth / 2);

                    // ⭐️ MEJORA 3: Aumentamos el ángulo máximo de rebote de 60° a 75° (PI/3 a 75*PI/180)
                    const maxBounceAngle = (75 * Math.PI) / 180; 
                    const angle = normalizedHit * maxBounceAngle;

                    const config = levelConfigs[currentLevel] || levelConfigs[5];
                    const speed = Math.sqrt(ballDX * ballDX + ballDY * ballDY) || (4 * config.speedMultiplier);

                    // Componente horizontal (seno) será más fuerte en los bordes
                    ballDX = speed * Math.sin(angle);
                    // Aseguramos que la componente Y siempre sea negativa (hacia arriba)
                    ballDY = -Math.abs(speed * Math.cos(angle)); 
                }
            }
        }


        // --- Lógica del Juego ---

        function ballMovement() {
            ballX += ballDX;
            ballY += ballDY;
            if (ballX + ballRadius > logicalWidth) {
                ballDX = -Math.abs(ballDX);
                ballX = logicalWidth - ballRadius;
            } else if (ballX - ballRadius < 0) {
                ballDX = Math.abs(ballDX);
                ballX = ballRadius;
            }
            if (ballY - ballRadius < 0) {
                ballDY = Math.abs(ballDY);
                ballY = ballRadius;
            }
            if (ballY - ballRadius > logicalHeight) {
                lives--;
                document.getElementById('lives').textContent = lives;
                if (lives <= 0) {
                    endGame();
                } else {
                    resetBall();
                }
            }
        }

        function paddleMovement() {
            if (rightPressed && paddleX < logicalWidth - paddleWidth) {
                paddleX += paddleSpeed;
            }
            if (leftPressed && paddleX > 0) {
                paddleX -= paddleSpeed;
            }
            paddleX = Math.min(Math.max(paddleX, 0), logicalWidth - paddleWidth);
        }

        function cleanCanvas() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        }

        function drawPauseText() {
            if (isPaused) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, logicalWidth, logicalHeight);
                ctx.fillStyle = "#fff";
                ctx.font = `${Math.max(18, Math.round(30 * scale))}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("PAUSADO", logicalWidth / 2, logicalHeight / 2);
                ctx.font = `${Math.max(12, Math.round(16 * scale))}px Arial`;
                ctx.fillText("Presiona ESPACIO para continuar", logicalWidth / 2, logicalHeight / 2 + 40 * scale);
            }
        }

        function checkWin() {
            return bricksDestroyed === totalBricks;
        }

        function endGame() {
            isGameRunning = false;
            document.getElementById('gameOverLevel').textContent = currentLevel;
            document.getElementById('gameOverScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function winLevel() {
            isGameRunning = false;
            document.getElementById('winLevel').textContent = currentLevel;
            document.getElementById('winScore').textContent = score;
            document.getElementById('winScreen').style.display = 'flex';
            const btnNext = document.getElementById('btnNext');
            if (currentLevel >= 5) {
                btnNext.textContent = '¡Juego Completado! Reiniciar';
                btnNext.onclick = resetGame;
            } else {
                btnNext.textContent = 'Siguiente Nivel';
                btnNext.onclick = nextLevel;
            }
        }

        window.nextLevel = function() {
            if (currentLevel < 5) {
                currentLevel++;
                document.getElementById('levelNumber').textContent = currentLevel;
                resetBall();
                initBricks();
                lives = 3;
                document.getElementById('lives').textContent = lives;
                document.getElementById('winScreen').style.display = 'none';
                isGameRunning = true; isPaused = false;
            } else {
                 resetGame();
            }
        }

        window.mainMenu = function() {
            currentLevel = 1;
            resetGame();
        }

        window.resetGame = function() {
            score = 0;
            lives = 3;
            currentLevel = 1;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('levelNumber').textContent = currentLevel;
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('winScreen').style.display = 'none';
            initBricks();
            resetBall();
            isGameRunning = true;
            isPaused = false;
        }

        // --- Eventos ---

        function initEvents() {
            document.addEventListener("keydown", keydownHandler);
            document.addEventListener("keyup", keyupHandler);

            // Pointer events for mouse & touch on canvas (drag to move)
            let pointerId = null;
            let pointerActive = false;
            function toLogicalX(clientX) {
                const rect = canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                return (x / rect.width) * logicalWidth;
            }
            canvas.addEventListener('pointerdown', (ev) => {
                pointerId = ev.pointerId;
                pointerActive = true;
                if (canvas.setPointerCapture) canvas.setPointerCapture(ev.pointerId);
                const lx = toLogicalX(ev.clientX);
                paddleX = Math.min(Math.max(lx - paddleWidth / 2, 0), logicalWidth - paddleWidth);
                ev.preventDefault();
            });
            canvas.addEventListener('pointermove', (ev) => {
                if (!pointerActive || ev.pointerId !== pointerId) return;
                const lx = toLogicalX(ev.clientX);
                paddleX = Math.min(Math.max(lx - paddleWidth / 2, 0), logicalWidth - paddleWidth);
                ev.preventDefault();
            });
            canvas.addEventListener('pointerup', (ev) => {
                if (ev.pointerId === pointerId) {
                    pointerActive = false; pointerId = null;
                    if (canvas.releasePointerCapture) canvas.releasePointerCapture(ev.pointerId);
                }
                ev.preventDefault();
            });
            canvas.addEventListener('pointercancel', () => {
                pointerActive = false;
                pointerId = null;
            });

            // Mobile on-screen controls buttons
            const btnLeft = document.getElementById('mobileLeft');
            const btnRight = document.getElementById('mobileRight');
            const btnPause = document.getElementById('mobilePause');
            if (btnLeft && btnRight && btnPause) {
                btnLeft.addEventListener('pointerdown', () => { leftPressed = true; });
                btnLeft.addEventListener('pointerup', () => { leftPressed = false; });
                btnLeft.addEventListener('pointercancel', () => { leftPressed = false; });
                btnLeft.addEventListener('pointerleave', () => { leftPressed = false; });

                btnRight.addEventListener('pointerdown', () => { rightPressed = true; });
                btnRight.addEventListener('pointerup', () => { rightPressed = false; });
                btnRight.addEventListener('pointercancel', () => { rightPressed = false; });
                btnRight.addEventListener('pointerleave', () => { rightPressed = false; });

                btnPause.addEventListener('click', () => {
                    isPaused = !isPaused;
                });
            }

            function keydownHandler(e) {
                const key = e.key;
                const code = e.code;
                if (key === "ArrowRight" || key === "d" || key === "D") {
                    rightPressed = true;
                } else if (key === "ArrowLeft" || key === "a" || key === "A") {
                    leftPressed = true;
                } else if (code === "Space") {
                    e.preventDefault();
                    if (isGameRunning) {
                        isPaused = !isPaused;
                    }
                }
            }

            function keyupHandler(e) {
                const key = e.key;
                if (key === "ArrowRight" || key === "d" || key === "D") {
                    rightPressed = false;
                } else if (key === "ArrowLeft" || key === "a" || key === "A") {
                    leftPressed = false;
                }
            }
        }


        // --- Bucle principal ---

        function draw() {
            if (isGameRunning && !isPaused) {
                ballMovement();
                collisionDetection();
                paddleMovement();
                if (checkWin()) {
                    winLevel();
                }
            }

            cleanCanvas();
            drawBricks();
            drawBall();
            drawPaddle();
            drawPauseText();

            window.requestAnimationFrame(draw);
        }

        // Inicializar
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            resetBall();
            initBricks();
        });
        initBricks();
        resetBall();
        initEvents();
        draw();
    </script>

</body>
</html>
